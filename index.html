<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b2a45">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="icon" href="data:,">
  <title>מרוץ החבילות</title>
  <style>
    #bootmsg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b2a45; color: #fff; font: 700 18px Rubik, "Segoe UI", Arial, sans-serif; text-align: center; padding: 20px; z-index: 0; }
    #bootmsg button { font: inherit; padding: 10px 22px; border-radius: 12px; border: 0; background: #e0a940; color: #1d2a3a; }
    #errbar { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 9999; background: #7a1f1f; color: #fff; border-radius: 10px; padding: 8px 12px; font: 600 13px "Segoe UI", Arial, sans-serif; direction: rtl; display: none; }
    #errbar button { font: inherit; margin-inline-start: 10px; border-radius: 8px; border: 0; padding: 3px 12px; }
  </style>
</head>
<body>
  <noscript>המשחק דורש JavaScript.</noscript>
  <div id="bootmsg"><div id="boottext">טוען את מרוץ החבילות...</div><button id="bootbtn" type="button" style="display:none">רענון</button></div>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="errbar"><span id="errtext"></span><button type="button" id="errbtn">רענון</button></div>
  <script>
    // If the page is older than the files on the server (it stayed open or was cached while the game was updated), its
    // script no longer exists: reload once with a fresh address. Any other failure is shown instead of a blank screen.
    (function () {
      function fresh() { location.replace(location.pathname + '?r=' + Date.now()); }
      function once() { try { if (sessionStorage.getItem('pr.reloaded')) return false; sessionStorage.setItem('pr.reloaded', '1'); } catch (e) { return false; } fresh(); return true; }
      function stuck(msg) { var t = document.getElementById('boottext'), b = document.getElementById('bootbtn'); if (t) t.textContent = msg; if (b) { b.style.display = ''; b.onclick = fresh; } }
      function bar(msg) { var e = document.getElementById('errbar'); if (!e) return; document.getElementById('errtext').textContent = 'תקלה במשחק: ' + msg + ' (צלמו את המסך ושלחו לנו)'; e.style.display = 'block'; document.getElementById('errbtn').onclick = fresh; }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { if (!once()) stuck('המשחק לא נטען. בדקו את החיבור ולחצו רענון.'); return; }
        if (e.message) bar(e.message + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { var r = e.reason; if (r && (r.name === 'NotAllowedError' || r.name === 'AbortError')) return; bar(String(r && r.message ? r.message : r).slice(0, 200)); });
      window.addEventListener('vite:preloadError', function () { once(); });
      setTimeout(function () { if (!window.__pr) stuck('הטעינה נמשכת זמן רב. בדקו את החיבור ולחצו רענון.'); }, 20000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
